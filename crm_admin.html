<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3M Capital CRM 管理</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { 
            color: #ffd700; 
            text-align: center; 
            margin-bottom: 30px;
            font-size: 28px;
        }
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: #0f0f23;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #2a2a4a;
        }
        .login-box h2 {
            color: #ffd700;
            margin-bottom: 20px;
            text-align: center;
        }
        .tabs { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: #0f0f23;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            color: #aaa;
            text-align: center;
            cursor: pointer;
        }
        .tab.active {
            background: #ffd700;
            color: #1a1a2e;
            font-weight: bold;
        }
        .card {
            background: #0f0f23;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #2a2a4a;
            display: none;
        }
        .card.active { display: block; }
        label { 
            display: block; 
            color: #ffd700; 
            margin-bottom: 8px; 
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            height: 45px;
            background: #1a1a2e;
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            margin-bottom: 15px;
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        input:focus, textarea:focus { outline: none; border-color: #ffd700; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 12px;
            color: #1a1a2e;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { transform: translateY(-2px); }
        .status { 
            text-align: center; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 16px;
            display: none;
        }
        .status.success { background: #1b4332; color: #95d5b2; display: block; }
        .status.error { background: #4a1c1c; color: #f8d7da; display: block; }
        
        .user-table {
            width: 100%;
            border-collapse: collapse;
        }
        .user-table th, .user-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2a2a4a;
            color: #fff;
        }
        .user-table th {
            color: #ffd700;
        }
        .user-table select {
            background: #1a1a2e;
            color: #fff;
            padding: 5px;
            border-radius: 4px;
        }
        
        #main-content { display: none; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logout-btn {
            background: #ff5252;
            width: auto;
            padding: 8px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 3M Capital CRM</h1>
        
        <!-- 登入頁面 -->
        <div id="login-page" class="login-box">
            <h2>管理員登入</h2>
            <div id="login-status" class="status"></div>
            <input type="text" id="login-phone" placeholder="手機號 (預設: admin)">
            <input type="password" id="login-password" placeholder="密碼">
            <button onclick="login()">登入</button>
            <p style="color: #666; font-size: 12px; text-align: center; margin-top: 15px;">
                提示：第一個註冊的用戶為管理員
            </p>
        </div>
        
        <!-- 主界面 -->
        <div id="main-content">
            <div class="header">
                <span style="color: #ffd700;">歡迎，管理員</span>
                <button class="logout-btn" onclick="logout()">登出</button>
            </div>
            
            <div class="tabs">
                <div class="tab active" onclick="switchTab('users')">會員列表</div>
                <div class="tab" onclick="switchTab('strategy')">策略管理</div>
                <div class="tab" onclick="switchTab('membership')">會員方案</div>
                <div class="tab" onclick="switchTab('analysis')">行情分析</div>
            </div>
            
            <div id="status" class="status"></div>
            
            <!-- 會員列表 -->
            <div id="card-users" class="card active">
                <h3 style="color: #ffd700; margin-bottom: 15px;">會員列表</h3>
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>手機號</th>
                            <th>姓名</th>
                            <th>會員狀態</th>
                            <th>到期日</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="user-list"></tbody>
                </table>
            </div>
            
            <!-- 策略管理 -->
            <div id="card-strategy" class="card">
                <label>🌅 早盤策略</label>
                <textarea id="morning" placeholder="輸入早盤策略..."></textarea>
                <label>⚡ 實時策略</label>
                <textarea id="realtime" placeholder="輸入實時策略..."></textarea>
                <label>🌇 午盤策略</label>
                <textarea id="afternoon" placeholder="輸入午盤策略..."></textarea>
                <button onclick="saveStrategies()">💾 儲存策略</button>
            </div>
            
            <!-- 會員方案 -->
            <div id="card-membership" class="card">
                <label>💎 會員方案內容</label>
                <textarea id="membership-content" placeholder="輸入會員方案..."></textarea>
                <button onclick="saveMembership()">💾 儲存會員方案</button>
            </div>
            
            <!-- 行情分析 -->
            <div id="card-analysis" class="card">
                <label>📊 行情分析內容</label>
                <textarea id="analysis-content" placeholder="輸入行情分析..."></textarea>
                <button onclick="saveAnalysis()">💾 儲存行情分析</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '';
        let token = localStorage.getItem('token');
        let currentTab = 'users';
        
        // 檢查登入狀態
        if (token) {
            showMain();
        }
        
        function showMain() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            loadUsers();
            loadStrategies();
            loadContent();
        }
        
        async function login() {
            const phone = document.getElementById('login-phone').value;
            const password = document.getElementById('login-password').value;
            
            try {
                const res = await fetch(API_URL + '/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({phone, password})
                });
                const data = await res.json();
                
                if (res.ok) {
                    token = data.access_token;
                    localStorage.setItem('token', token);
                    showMain();
                } else {
                    showStatus('登入失敗：' + data.error, 'error');
                }
            } catch(e) {
                showStatus('網絡錯誤', 'error');
            }
        }
        
        function logout() {
            localStorage.removeItem('token');
            token = null;
            document.getElementById('login-page').style.display = 'block';
            document.getElementById('main-content').style.display = 'none';
        }
        
        async function loadUsers() {
            try {
                const res = await fetch(API_URL + '/api/admin/users', {
                    headers: {'Authorization': 'Bearer ' + token}
                });
                if (res.ok) {
                    const users = await res.json();
                    renderUsers(users);
                }
            } catch(e) {
                console.error(e);
            }
        }
        
        function renderUsers(users) {
            const tbody = document.getElementById('user-list');
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.phone}</td>
                    <td>${u.name || '-'}</td>
                    <td>
                        <select onchange="updateMembership(${u.id}, this.value)">
                            <option value="free" ${u.membership === 'free' ? 'selected' : ''}>免費</option>
                            <option value="3month" ${u.membership === '3month' ? 'selected' : ''}>3個月</option>
                            <option value="6month" ${u.membership === '6month' ? 'selected' : ''}>6個月</option>
                            <option value="12month" ${u.membership === '12month' ? 'selected' : ''}>12個月</option>
                        </select>
                    </td>
                    <td>${u.membership_expire || '-'}</td>
                    <td>-</td>
                </tr>
            `).join('');
        }
        
        async function updateMembership(userId, membership) {
            try {
                await fetch(API_URL + `/api/admin/users/${userId}/membership`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({membership})
                });
                showStatus('會員狀態已更新', 'success');
            } catch(e) {
                showStatus('更新失敗', 'error');
            }
        }
        
        async function loadStrategies() {
            try {
                const res = await fetch(API_URL + '/api/strategies/today');
                const data = await res.json();
                document.getElementById('morning').value = data.morning || '';
                document.getElementById('realtime').value = data.realtime || '';
                document.getElementById('afternoon').value = data.afternoon || '';
            } catch(e) {
                console.error(e);
            }
        }
        
        async function saveStrategies() {
            try {
                await fetch(API_URL + '/api/strategies/set', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        morning: document.getElementById('morning').value,
                        realtime: document.getElementById('realtime').value,
                        afternoon: document.getElementById('afternoon').value
                    })
                });
                showStatus('✅ 策略已儲存', 'success');
            } catch(e) {
                showStatus('❌ 儲存失敗', 'error');
            }
        }
        
        async function loadContent() {
            try {
                const [m, a] = await Promise.all([
                    fetch(API_URL + '/api/content/membership'),
                    fetch(API_URL + '/api/content/analysis')
                ]);
                const mem = await m.json();
                const ana = await a.json();
                document.getElementById('membership-content').value = mem.content || '';
                document.getElementById('analysis-content').value = ana.content || '';
            } catch(e) {
                console.error(e);
            }
        }
        
        async function saveMembership() {
            try {
                await fetch(API_URL + '/api/content/set', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({membership: document.getElementById('membership-content').value})
                });
                showStatus('✅ 會員方案已儲存', 'success');
            } catch(e) {
                showStatus('❌ 儲存失敗', 'error');
            }
        }
        
        async function saveAnalysis() {
            try {
                await fetch(API_URL + '/api/content/set', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({analysis: document.getElementById('analysis-content').value})
                });
                showStatus('✅ 行情分析已儲存', 'success');
            } catch(e) {
                showStatus('❌ 儲存失敗', 'error');
            }
        }
        
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('card-' + tab).classList.add('active');
        }
        
        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.className = `status ${type}`;
            el.textContent = msg;
            setTimeout(() => el.className = 'status', 3000);
        }
    </script>
</body>
</html>
