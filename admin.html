<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3M Capital 內容管理</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { 
            color: #ffd700; 
            text-align: center; 
            margin-bottom: 30px;
            font-size: 24px;
        }
        .tabs { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: #0f0f23;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            color: #aaa;
            text-align: center;
            cursor: pointer;
        }
        .tab.active {
            background: #ffd700;
            color: #1a1a2e;
            font-weight: bold;
        }
        .card {
            background: #0f0f23;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #2a2a4a;
            display: none;
        }
        .card.active { display: block; }
        label { 
            display: block; 
            color: #ffd700; 
            margin-bottom: 8px; 
            font-weight: bold;
        }
        textarea {
            width: 100%;
            height: 120px;
            background: #1a1a2e;
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            resize: vertical;
        }
        textarea:focus { outline: none; border-color: #ffd700; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 12px;
            color: #1a1a2e;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { transform: translateY(-2px); }
        .status { 
            text-align: center; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 16px;
            display: none;
        }
        .status.success { background: #1b4332; color: #95d5b2; display: block; }
        .status.error { background: #4a1c1c; color: #f8d7da; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 3M Capital 內容管理</h1>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('strategy')">策略</div>
            <div class="tab" onclick="switchTab('membership')">會員方案</div>
            <div class="tab" onclick="switchTab('analysis')">行情分析</div>
        </div>
        
        <div id="status" class="status"></div>
        
        <!-- 策略管理 -->
        <div id="card-strategy" class="card active">
            <label>🌅 早盤策略 (10:00-10:05)</label>
            <textarea id="morning" placeholder="輸入早盤策略內容..."></textarea>
            
            <label style="margin-top: 16px;">⚡ 實時策略 (16:00-16:05)</label>
            <textarea id="realtime" placeholder="輸入實時策略內容..."></textarea>
            
            <label style="margin-top: 16px;">🌇 午盤策略 (17:00-17:05)</label>
            <textarea id="afternoon" placeholder="輸入午盤策略內容..."></textarea>
            
            <button onclick="saveStrategies()">💾 儲存策略</button>
        </div>
        
        <!-- 會員方案 -->
        <div id="card-membership" class="card">
            <label>💎 會員方案內容</label>
            <textarea id="membership" placeholder="輸入會員方案內容..."></textarea>
            <button onclick="saveMembership()">💾 儲存會員方案</button>
        </div>
        
        <!-- 行情分析 -->
        <div id="card-analysis" class="card">
            <label>📊 行情分析內容</label>
            <textarea id="analysis" placeholder="輸入行情分析內容..."></textarea>
            <button onclick="saveAnalysis()">💾 儲存行情分析</button>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let currentTab = 'strategy';
        
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('card-' + tab).classList.add('active');
            
            if (tab === 'strategy') loadStrategies();
            else if (tab === 'membership') loadMembership();
            else if (tab === 'analysis') loadAnalysis();
        }
        
        // 策略
        async function loadStrategies() {
            try {
                const res = await fetch(`${API_URL}/strategies/today`);
                const data = await res.json();
                document.getElementById('morning').value = data.morning || '';
                document.getElementById('realtime').value = data.realtime || '';
                document.getElementById('afternoon').value = data.afternoon || '';
            } catch(e) {
                showStatus('❌ 載入失敗', 'error');
            }
        }
        
        async function saveStrategies() {
            const data = {
                morning: document.getElementById('morning').value,
                realtime: document.getElementById('realtime').value,
                afternoon: document.getElementById('afternoon').value
            };
            
            try {
                await fetch(`${API_URL}/strategies/set`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                showStatus('✅ 策略已儲存！', 'success');
            } catch(e) {
                showStatus('❌ 儲存失敗', 'error');
            }
        }
        
        // 會員方案
        async function loadMembership() {
            try {
                const res = await fetch(`${API_URL}/content/membership`);
                const data = await res.json();
                document.getElementById('membership').value = data.content || '';
            } catch(e) {
                console.error(e);
            }
        }
        
        async function saveMembership() {
            const data = { membership: document.getElementById('membership').value };
            
            try {
                await fetch(`${API_URL}/content/set`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                showStatus('✅ 會員方案已儲存！', 'success');
            } catch(e) {
                showStatus('❌ 儲存失敗', 'error');
            }
        }
        
        // 行情分析
        async function loadAnalysis() {
            try {
                const res = await fetch(`${API_URL}/content/analysis`);
                const data = await res.json();
                document.getElementById('analysis').value = data.content || '';
            } catch(e) {
                console.error(e);
            }
        }
        
        async function saveAnalysis() {
            const data = { analysis: document.getElementById('analysis').value };
            
            try {
                await fetch(`${API_URL}/content/set`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                showStatus('✅ 行情分析已儲存！', 'success');
            } catch(e) {
                showStatus('❌ 儲存失敗', 'error');
            }
        }
        
        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.className = `status ${type}`;
            el.textContent = msg;
            setTimeout(() => el.className = 'status', 3000);
        }
        
        // 初始載入
        loadStrategies();
    </script>
</body>
</html>
